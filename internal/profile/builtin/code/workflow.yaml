apiVersion: takt/v1alpha1
kind: Workflow
metadata:
  name: code-plan
  description: Implement a Markdown plan, validate the project, review the diff, and request approval
defaults:
  assistant: opencode
  model: implementation
  session: resume
nodes:
  - id: implementation
    subworkflow:
      path: workflows/implementation.yaml
      inputs:
        plan: ${input}

  - id: review-cycle
    depends_on: [implementation]
    subworkflow:
      path: workflows/review.yaml
      inputs:
        plan: ${input}

  - id: final-validation
    depends_on: [review-cycle]
    bash: |
      ./.takt/profiles/code/tools/validate

  - id: approve
    depends_on: [final-validation]
    approval:
      message: Implementation and review are complete. Approve the result.
      capture_response: true
