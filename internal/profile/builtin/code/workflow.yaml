---
nodes:
- id: route
  command: route-workflow
  model: routing
  allowed_tools: []
  skills: []
  attempts:
    max: 2
    retry_on:
    - protocol
    retry_session: fresh
  output_format:
    type: object
    additionalProperties: false
    properties:
      workflow:
        type: string
        enum:
        - assist
        - fix-github-issue
        - create-issue
        - issue-review-full
        - piv-loop
        - idea-to-pr
        - plan-to-pr
        - feature-development
        - adversarial-dev
        - smart-pr-review
        - comprehensive-pr-review
        - validate-pr
        - architect
        - refactor-safely
        - interactive-prd
        - ralph-dag
        - workflow-builder
        - remotion-generate
        - resolve-conflicts
      reason:
        type: string
    required:
    - workflow
    - reason
- id: assist
  depends_on:
  - route
  when: $route.output.workflow == "assist"
  workflow:
    path: workflows/assist.yaml
    input: "$ARGUMENTS"
- id: fix-github-issue
  depends_on:
  - route
  when: $route.output.workflow == "fix-github-issue"
  workflow:
    path: workflows/fix-github-issue.yaml
