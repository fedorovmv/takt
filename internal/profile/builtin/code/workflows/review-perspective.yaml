apiVersion: takt/v1alpha1
kind: Workflow
metadata:
  name: review-perspective
  description: Run one isolated, evidence-scoped review perspective and publish a typed finding artifact.
defaults:
  assistant: coding-agent
  model: review
  session: fresh
nodes:
  - id: review
    command: review-perspective
    denied_tools: [edit, write]
    output_format:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [ready, blocked, failed]
        code:
          type: string
          enum: [PERSPECTIVE_REVIEW_COMPLETE, PERSPECTIVE_SCOPE_INVALID, PERSPECTIVE_EVIDENCE_INCOMPLETE]
        summary:
          type: string
        evidence:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
        artifact_path:
          type: string
        findings:
          type: array
          uniqueItems: true
          items:
            type: string
      required: [status, code, summary, evidence, artifact_path, findings]
    output_type: review-perspective
    output_mime: application/json
    output_path: $ARTIFACTS_DIR/review-perspective.json
