---
nodes:
- id: result
  command: dynamic-baseline
  allowed_tools:
  - read
  - grep
  - glob
  - bash
  denied_tools:
  - write
  - edit
  output_format:
    type: object
    additionalProperties: false
    properties:
      summary:
        type: string
        minLength: 1
      base_ref:
        type: string
      passed_checks:
        type: array
        items:
          type: string
      known_failures:
        type: array
        items:
          type: string
      unavailable_checks:
        type: array
        items:
          type: string
      evidence:
        type: array
        items:
          type: string
    required:
    - summary
    - base_ref
    - passed_checks
    - known_failures
    - unavailable_checks
    - evidence
  output_type: repository-baseline
  output_mime: application/json
name: dynamic-baseline
description: Capture pre-change checks and known failures for regression-aware validation.
provider: coding-agent
model: review
