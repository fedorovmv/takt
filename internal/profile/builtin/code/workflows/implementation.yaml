apiVersion: takt/v1alpha1
kind: Workflow
metadata:
  name: code-implementation
defaults:
  assistant: opencode
  model: implementation
  session: resume
nodes:
  - id: implement
    command: implement-plan
    attempts:
      max: 3
    timeout: 60m
    hooks:
      after_node:
        - id: project-validation
          bash: |
            ./.takt/profiles/code/tools/validate
          on_failure:
            action: retry
            session: resume
