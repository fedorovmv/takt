apiVersion: takt/v1alpha1
kind: Workflow
metadata:
  name: smart-pr-review
  description: Classify PR complexity, run only relevant review agents in parallel, synthesize findings, fix them, and validate.
defaults:
  assistant: opencode
  model: review
  session: fresh
nodes:
  - id: review
    workflow:
      path: smart-review-block.yaml
      isolation: inherit

  - id: summary
    depends_on: [review]
    command: summary
