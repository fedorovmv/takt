apiVersion: takt/v1alpha1
kind: Workflow
metadata:
  name: code-review-block
  description: Run five independent governed review Runs in parallel, synthesize findings, repair them, and validate.
defaults:
  assistant: opencode
  model: review
  session: fresh
nodes:
  - id: scope
    command: review-scope

  - id: perspectives
    depends_on: [scope]
    script:
      runtime: command
      path: ../tools/review-perspectives
    output_format:
      type: array
      items:
        type: string
        enum: [code, errors, tests, docs, simplicity]
    output_type: review-perspectives
    output_mime: application/json

  - id: reviews
    depends_on: [scope, perspectives]
    workflow:
      path: review-perspective.yaml
      input: |
        Perspective: ${perspective}

        Scoped change:
        ${nodes.scope.output}
      isolation: inherit
      output_node: review
      fan_out:
        items_from: nodes.perspectives.output
        as: perspective
        max_parallel: 5
        join: all_success

  - id: synthesize
    depends_on: [reviews]
    command: synthesize-review

  - id: fixes
    depends_on: [synthesize]
    command: fix-review-findings
    model: implementation
    attempts:
      max: 2
    hooks:
      after_node:
        - id: validate-fixes
          bash: ./.takt/profiles/code/tools/validate
          on_failure:
            action: retry
            session: resume

  - id: final-validation
    depends_on: [fixes]
    bash: ./.takt/profiles/code/tools/validate
