apiVersion: takt/v1alpha1
kind: Workflow
metadata:
  name: code-review-block
  description: Run five independent review perspectives, synthesize findings, repair them, and validate.
defaults:
  assistant: opencode
  model: review
  session: fresh
nodes:
  - id: scope
    command: review-scope

  - id: code
    depends_on: [scope]
    command: review-code

  - id: errors
    depends_on: [scope]
    command: review-errors

  - id: tests
    depends_on: [scope]
    command: review-tests

  - id: docs
    depends_on: [scope]
    command: review-docs

  - id: simplicity
    depends_on: [scope]
    command: review-simplicity

  - id: synthesize
    depends_on: [code, errors, tests, docs, simplicity]
    command: synthesize-review

  - id: fixes
    depends_on: [synthesize]
    command: fix-review-findings
    model: implementation
    attempts:
      max: 2
    hooks:
      after_node:
        - id: validate-fixes
          bash: ./.takt/profiles/code/tools/validate
          on_failure:
            action: retry
            session: resume

  - id: final-validation
    depends_on: [fixes]
    bash: ./.takt/profiles/code/tools/validate
