apiVersion: takt/v1alpha1
kind: Workflow
metadata:
  name: code-review-block
  description: Run five independent review perspectives, synthesize findings, repair them, and validate.
defaults:
  assistant: opencode
  model: review
  session: fresh
nodes:
  - id: scope
    command: review-scope

  - id: perspectives
    depends_on: [scope]
    foreach:
      items: [code, errors, tests, docs, simplicity]
      as: perspective
      parallel: true
      subworkflow:
        path: review-perspective.yaml
        inputs:
          perspective: ${perspective}
          scope: ${nodes.scope.output}

  - id: synthesize
    depends_on: [perspectives]
    command: synthesize-review

  - id: fixes
    depends_on: [synthesize]
    command: fix-review-findings
    model: implementation
    attempts:
      max: 2
    hooks:
      after_node:
        - id: validate-fixes
          bash: ./.takt/profiles/code/tools/validate
          on_failure:
            action: retry
            session: resume

  - id: final-validation
    depends_on: [fixes]
    bash: ./.takt/profiles/code/tools/validate
