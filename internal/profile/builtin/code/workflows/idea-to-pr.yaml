apiVersion: takt/v1alpha1
kind: Workflow
metadata:
  name: idea-to-pr
  description: Turn a repository-scoped idea into researched and approved implementation, validation recovery, PR and comprehensive review.
input:
  format: json
  schema:
    type: object
    additionalProperties: false
    properties:
      repository:
        type: string
      idea:
        type: string
      base_branch:
        type: string
      draft_pr:
        type: boolean
      validation_commands:
        type: array
        items:
          type: string
        minItems: 1
        uniqueItems: true
      scope_limits:
        type: array
        items:
          type: string
        uniqueItems: true
    required:
      - repository
      - idea
      - base_branch
      - draft_pr
      - validation_commands
defaults:
  assistant: opencode
  model: implementation
  session: fresh
nodes:
  - id: git-prepare
    command: git-prepare
    output_format:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
            - ready
            - blocked
            - failed
        code:
          type: string
          enum:
            - GIT_READY
            - GIT_DIRTY
            - GIT_BRANCH_MISMATCH
            - GIT_BASE_MISSING
            - GIT_REMOTE_MISSING
        summary:
          type: string
        evidence:
          type: array
          items:
            type: string
          minItems: 1
          uniqueItems: true
        artifact_path:
          type: string
      required:
        - status
        - code
        - summary
        - evidence
        - artifact_path
    output_type: git-state
    output_mime: application/json
    output_path: $ARTIFACTS_DIR/git-state.json
  - id: research
    command: idea-research
    depends_on:
      - git-prepare
    when: nodes.git-prepare.output.status == "ready"
    model: review
    output_format:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
            - ready
            - blocked
            - failed
        code:
          type: string
          enum:
            - IDEA_RESEARCH_READY
            - IDEA_SCOPE_AMBIGUOUS
            - IDEA_CONFLICTS_WITH_ARCHITECTURE
            - IDEA_EVIDENCE_INCOMPLETE
        summary:
          type: string
        evidence:
          type: array
          items:
            type: string
          minItems: 1
          uniqueItems: true
        artifact_path:
          type: string
      required:
        - status
        - code
        - summary
        - evidence
        - artifact_path
    output_type: idea-research
    output_mime: text/markdown
    output_path: $ARTIFACTS_DIR/idea-research.md
  - id: plan
    command: idea-plan
    depends_on:
      - git-prepare
      - research
    when: nodes.research.output.status == "ready"
    model: review
    output_format:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
            - ready
            - blocked
            - failed
        code:
          type: string
          enum:
            - IDEA_PLAN_READY
            - IDEA_DECISION_REQUIRED
            - IDEA_PLAN_SCOPE_DRIFT
            - IDEA_PLAN_CONTRACT_UNRESOLVED
        summary:
          type: string
        evidence:
          type: array
          items:
            type: string
          minItems: 1
          uniqueItems: true
        artifact_path:
          type: string
      required:
        - status
        - code
        - summary
        - evidence
        - artifact_path
    output_type: plan
    output_mime: text/markdown
    output_path: $ARTIFACTS_DIR/plan.md
  - id: approve-plan
    depends_on:
      - plan
    when: nodes.plan.output.status == "ready"
    approval:
      message: Review the typed plan artifact and approve implementation or provide exact corrections.
      capture_response: true
  - id: implement
    command: plan-implementation
    depends_on:
      - approve-plan
    session: resume
    attempts:
      max: 3
    output_format:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
            - ready
            - blocked
            - failed
        code:
          type: string
          enum:
            - PLAN_IMPLEMENTED
            - PLAN_IMPLEMENTATION_BLOCKED
            - PLAN_DEVIATION_REQUIRES_APPROVAL
            - PLAN_TEST_FAILED
            - PLAN_CONTRACT_BROKEN
        summary:
          type: string
        evidence:
          type: array
          items:
            type: string
          minItems: 1
          uniqueItems: true
        artifact_path:
          type: string
      required:
        - status
        - code
        - summary
        - evidence
        - artifact_path
    output_type: implementation-report
    output_mime: text/markdown
    output_path: $ARTIFACTS_DIR/implementation-report.md
  - id: validation-commands
    depends_on:
      - implement
    when: nodes.implement.output.status == "ready"
    script:
      runtime: validation
    allow_failure: true
    output_format:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
            - ready
            - failed
        results:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              command:
                type: string
              exit_code:
                type: integer
              stdout:
                type: string
              stderr:
                type: string
            required:
              - command
              - exit_code
      required:
        - status
        - results
    output_type: validation-command-report
    output_mime: application/json
    output_path: $ARTIFACTS_DIR/validation-commands.json
  - id: validate
    command: change-validation
    depends_on:
      - implement
      - validation-commands
    trigger_rule: all_done
    when: nodes.implement.output.status == "ready"
    model: review
    output_format:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
            - ready
            - blocked
            - failed
        code:
          type: string
          enum:
            - VALIDATION_PASSED
            - VALIDATION_FAILED
            - VALIDATION_ENVIRONMENT_MISSING
            - ACCEPTANCE_NOT_PROVEN
            - DIFF_SCOPE_VIOLATION
        summary:
          type: string
        evidence:
          type: array
          items:
            type: string
          minItems: 1
          uniqueItems: true
        artifact_path:
          type: string
      required:
        - status
        - code
        - summary
        - evidence
        - artifact_path
    output_type: validation-report
    output_mime: text/markdown
    output_path: $ARTIFACTS_DIR/validation-report.md
  - id: recover
    command: workflow-recovery
    depends_on:
      - validate
      - validation-commands
    trigger_rule: all_done
    when: nodes.validation-commands.output.status != "ready" || nodes.validate.output.status != "ready"
    output_format:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
            - ready
            - blocked
            - failed
        code:
          type: string
          enum:
            - RECOVERY_APPLIED
            - RECOVERY_NOT_POSSIBLE
            - RECOVERY_REQUIRES_HUMAN
            - RECOVERY_SCOPE_CONFLICT
        summary:
          type: string
        evidence:
          type: array
          items:
            type: string
          minItems: 1
          uniqueItems: true
        artifact_path:
          type: string
      required:
        - status
        - code
        - summary
        - evidence
        - artifact_path
    output_type: recovery-report
    output_mime: text/markdown
    output_path: $ARTIFACTS_DIR/recovery-report.md
  - id: revalidation-commands
    depends_on:
      - recover
    when: nodes.validation-commands.output.status != "ready" || nodes.validate.output.status != "ready"
    script:
      runtime: validation
    allow_failure: true
    output_format:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
            - ready
            - failed
        results:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              command:
                type: string
              exit_code:
                type: integer
              stdout:
                type: string
              stderr:
                type: string
            required:
              - command
              - exit_code
      required:
        - status
        - results
    output_type: validation-command-report
    output_mime: application/json
    output_path: $ARTIFACTS_DIR/revalidation-commands.json
  - id: revalidate
    command: change-validation
    depends_on:
      - revalidation-commands
    model: review
    trigger_rule: all_done
    when: nodes.validation-commands.output.status != "ready" || nodes.validate.output.status != "ready"
    output_format:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
            - ready
            - blocked
            - failed
        code:
          type: string
          enum:
            - VALIDATION_PASSED
            - VALIDATION_FAILED
            - VALIDATION_ENVIRONMENT_MISSING
            - ACCEPTANCE_NOT_PROVEN
            - DIFF_SCOPE_VIOLATION
        summary:
          type: string
        evidence:
          type: array
          items:
            type: string
          minItems: 1
          uniqueItems: true
        artifact_path:
          type: string
      required:
        - status
        - code
        - summary
        - evidence
        - artifact_path
    output_type: validation-report
    output_mime: text/markdown
    output_path: $ARTIFACTS_DIR/validation-report.md
  - id: validation-gate
    depends_on:
      - validation-commands
      - validate
      - recover
      - revalidation-commands
      - revalidate
    trigger_rule: all_done
    bash: |
      if { [ "${nodes.validation-commands.output.status}" = "ready" ] && [ "${nodes.validate.output.status}" = "ready" ]; } || { [ "${nodes.revalidation-commands.output.status?}" = "ready" ] && [ "${nodes.revalidate.output.status?}" = "ready" ]; }; then
        exit 0
      fi
      printf 'validation failed: initial=%s recovery=%s revalidate=%s
      '   '${nodes.validate.output.code}' '${nodes.recover.output.code?}' '${nodes.revalidate.output.code?}' >&2
      exit 1
  - id: create-pr
    command: pr-finalize
    depends_on:
      - validation-gate
    output_format:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
            - ready
            - blocked
            - failed
        code:
          type: string
          enum:
            - PR_READY
            - PR_GIT_STATE_INVALID
            - PR_DIFF_SCOPE_VIOLATION
            - PR_VALIDATION_MISSING
            - PR_PUSH_FAILED
            - PR_CREATE_FAILED
        summary:
          type: string
        evidence:
          type: array
          items:
            type: string
          minItems: 1
          uniqueItems: true
        artifact_path:
          type: string
      required:
        - status
        - code
        - summary
        - evidence
        - artifact_path
    output_type: pr-metadata
    output_mime: application/json
    output_path: $ARTIFACTS_DIR/pr.json
  - id: review
    depends_on:
      - create-pr
    when: nodes.create-pr.output.status == "ready"
    workflow:
      path: review-block.yaml
      input: ${input}
      isolation: inherit
  - id: summary
    command: workflow-final-summary
    depends_on:
      - review
    model: review
    output_format:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
            - ready
            - blocked
            - failed
        code:
          type: string
          enum:
            - WORKFLOW_COMPLETE
            - WORKFLOW_INCOMPLETE
            - EVIDENCE_INCONSISTENT
        summary:
          type: string
        evidence:
          type: array
          items:
            type: string
          minItems: 1
          uniqueItems: true
        artifact_path:
          type: string
      required:
        - status
        - code
        - summary
        - evidence
        - artifact_path
    output_type: workflow-summary
    output_mime: text/markdown
    output_path: $ARTIFACTS_DIR/summary.md
worktree:
  enabled: true
  cleanup: on_success
