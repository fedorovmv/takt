---
nodes:
- id: review
  workflow:
    path: review-block.yaml
    input: "$ARGUMENTS"
    isolation: inherit
- id: summary
  depends_on:
  - review
  command: summary
name: comprehensive-pr-review
description: Run code, error-handling, test, documentation, and simplicity reviews
  in parallel, synthesize findings, fix them, and validate.
provider: coding-agent
model: review
