apiVersion: takt/v1alpha1
kind: Workflow
metadata:
  name: dynamic-replan
  description: Reassess only the unfinished part of a Dynamic Takt plan at an explicit checkpoint.
defaults:
  assistant: opencode
  model: routing
  session: fresh
nodes:
  - id: replan
    command: dynamic-replan
    allowed_tools: []
    skills: []
    attempts:
      max: 2
      retry_on: [protocol]
      retry_session: fresh
    output_format:
      type: object
      additionalProperties: false
      properties:
        action:
          type: string
          enum: [continue, replace_remaining, finish, ask_user]
        reason:
          type: string
          minLength: 1
        phases:
          type: array
          maxItems: 256
          items:
            type: object
            additionalProperties: false
            properties:
              id:
                type: string
                pattern: "^[a-z][a-z0-9-]{0,62}$"
              uses:
                type: string
                enum: [discover, investigate, implement, validate, review, adversarial-verify, synthesize]
              objective:
                type: string
                minLength: 1
              depends_on:
                type: array
                uniqueItems: true
                items:
                  type: string
              strategy:
                type: string
                enum: [task, map]
              source:
                type: string
              max_parallel:
                type: integer
                minimum: 1
                maximum: 64
              checkpoint:
                type: boolean
            required: [id, uses, objective, strategy]
      required: [action, reason, phases]
