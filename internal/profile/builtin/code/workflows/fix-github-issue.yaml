apiVersion: takt/v1alpha1
kind: Workflow
metadata:
  name: fix-github-issue
  description: Classify and investigate a GitHub issue, implement and validate the fix, create a PR, run smart review, and self-fix findings.
worktree:
  enabled: true
  cleanup: on_success

defaults:
  assistant: opencode
  model: implementation
  session: fresh
nodes:
  - id: classify
    command: classify-issue
    model: routing
    allowed_tools: []
    skills: []
    output_format:
      type: object
      additionalProperties: false
      properties:
        issue_type:
          type: string
          enum: [bug, feature, enhancement, refactor, chore, documentation]
        title:
          type: string
        issue_number:
          type: string
        repository:
          type: string
      required: [issue_type, title]

  - id: investigate
    depends_on: [classify]
    when: nodes.classify.output.issue_type == "bug"
    command: investigate-issue

  - id: plan
    depends_on: [classify]
    when: nodes.classify.output.issue_type != "bug"
    command: plan-change

  - id: implement
    depends_on: [investigate, plan]
    trigger_rule: one_success
    command: implement-change
    model: implementation
    session: resume
    attempts:
      max: 3
    hooks:
      after_node:
        - id: focused-validation
          bash: ./.takt/profiles/code/tools/validate
          on_failure:
            action: retry
            session: resume

  - id: validate-agent
    depends_on: [implement]
    command: validate-change
    model: review

  - id: validate
    depends_on: [validate-agent]
    bash: ./.takt/profiles/code/tools/validate

  - id: create-pr
    depends_on: [validate]
    command: create-pr

  - id: review
    depends_on: [create-pr]
    workflow:
      path: smart-review-block.yaml
      isolation: inherit

  - id: summary
    depends_on: [review]
    command: summary
    model: review
