---
input:
  format: json
  schema:
    type: object
    additionalProperties: false
    properties:
      repository:
        type: string
      issue_number:
        type: integer
      issue_url:
        type: string
      base_branch:
        type: string
      draft_pr:
        type: boolean
      validation_commands:
        type: array
        items:
          type: string
        minItems: 1
        uniqueItems: true
      scope_limits:
        type: array
        items:
          type: string
        uniqueItems: true
    required:
    - repository
    - issue_number
    - base_branch
    - draft_pr
    - validation_commands
nodes:
- id: issue-intake
  command: issue-intake
  model: review
  output_format:
    type: object
    additionalProperties: false
    properties:
      status:
        type: string
        enum:
        - ready
        - blocked
        - failed
      code:
        type: string
        enum:
        - ISSUE_READY
        - ISSUE_NOT_FOUND
        - ISSUE_REPOSITORY_MISMATCH
        - ISSUE_ALREADY_ADDRESSED
        - ISSUE_INPUT_AMBIGUOUS
      summary:
        type: string
      evidence:
        type: array
        items:
          type: string
        minItems: 1
        uniqueItems: true
      artifact_path:
        type: string
    required:
    - status
    - code
    - summary
    - evidence
    - artifact_path
  output_type: issue-intake
  output_mime: application/json
  output_path: "$ARTIFACTS_DIR/issue-intake.json"
- id: git-prepare
  command: git-prepare
  depends_on:
  - issue-intake
  when: $issue-intake.output.status == "ready"
  output_format:
    type: object
    additionalProperties: false
    properties:
      status:
        type: string
        enum:
        - ready
        - blocked
        - failed
      code:
        type: string
        enum:
        - GIT_READY
        - GIT_DIRTY
        - GIT_BRANCH_MISMATCH
        - GIT_BASE_MISSING
        - GIT_REMOTE_MISSING
      summary:
        type: string
      evidence:
        type: array
        items:
          type: string
        minItems: 1
        uniqueItems: true
      artifact_path:
        type: string
    required:
    - status
    - code
    - summary
    - evidence
    - artifact_path
  output_type: git-state
  output_mime: application/json
  output_path: "$ARTIFACTS_DIR/git-state.json"
- id: investigate
  command: issue-root-cause
  depends_on:
  - issue-intake
  - git-prepare
  when: $git-prepare.output.status == "ready"
  model: review
  output_format:
    type: object
    additionalProperties: false
    properties:
      status:
        type: string
        enum:
        - ready
        - blocked
        - failed
      code:
        type: string
        enum:
        - ROOT_CAUSE_CONFIRMED
        - ROOT_CAUSE_UNCONFIRMED
        - REPOSITORY_STATE_UNEXPECTED
        - ISSUE_SCOPE_CONFLICT
      summary:
        type: string
      evidence:
        type: array
        items:
          type: string
        minItems: 1
        uniqueItems: true
      artifact_path:
        type: string
    required:
    - status
    - code
    - summary
    - evidence
    - artifact_path
  output_type: investigation
  output_mime: text/markdown
  output_path: "$ARTIFACTS_DIR/investigation.md"
- id: reproduce
  command: issue-reproduction
  depends_on:
  - investigate
  when: $investigate.output.status == "ready"
  model: review
  output_format:
    type: object
    additionalProperties: false
    properties:
      status:
        type: string
        enum:
        - ready
        - blocked
        - failed
      code:
        type: string
        enum:
        - ISSUE_REPRODUCED
        - ISSUE_NOT_REPRODUCED
        - REPRODUCTION_ENVIRONMENT_MISSING
        - REPRODUCTION_UNSAFE
      summary:
        type: string
      evidence:
        type: array
        items:
          type: string
        minItems: 1
        uniqueItems: true
      artifact_path:
        type: string
    required:
    - status
    - code
    - summary
    - evidence
    - artifact_path
  output_type: reproduction
  output_mime: text/markdown
  output_path: "$ARTIFACTS_DIR/reproduction.md"
- id: plan
  command: issue-fix-plan
  depends_on:
  - reproduce
  when: $reproduce.output.status == "ready"
  model: review
  output_format:
    type: object
    additionalProperties: false
    properties:
      status:
        type: string
        enum:
        - ready
        - blocked
        - failed
      code:
        type: string
        enum:
        - FIX_PLAN_READY
        - PLAN_EVIDENCE_INCOMPLETE
        - PLAN_SCOPE_EXCEEDS_ISSUE
        - PLAN_CONTRACT_UNRESOLVED
      summary:
        type: string
      evidence:
        type: array
        items:
          type: string
        minItems: 1
        uniqueItems: true
      artifact_path:
        type: string
    required:
    - status
    - code
    - summary
    - evidence
    - artifact_path
  output_type: fix-plan
  output_mime: text/markdown
  output_path: "$ARTIFACTS_DIR/fix-plan.md"
- id: implement
  command: issue-implementation
  depends_on:
  - plan
  when: $plan.output.status == "ready"
  attempts:
    max: 3
  output_format:
    type: object
    additionalProperties: false
    properties:
      status:
        type: string
        enum:
        - ready
        - blocked
        - failed
      code:
        type: string
        enum:
        - IMPLEMENTATION_READY
        - IMPLEMENTATION_BLOCKED
        - IMPLEMENTATION_SCOPE_DRIFT
        - IMPLEMENTATION_TEST_FAILED
        - IMPLEMENTATION_CONTRACT_BROKEN
      summary:
        type: string
      evidence:
        type: array
        items:
          type: string
        minItems: 1
        uniqueItems: true
      artifact_path:
        type: string
    required:
    - status
    - code
    - summary
    - evidence
    - artifact_path
  output_type: implementation-report
  output_mime: text/markdown
  output_path: "$ARTIFACTS_DIR/implementation-report.md"
  context:
- id: validation-commands
  depends_on:
  - implement
  when: $implement.output.status == "ready"
  script:
    runtime: validation
  allow_failure: true
  output_format:
    type: object
    additionalProperties: false
    properties:
      status:
        type: string
        enum:
        - ready
        - failed
      results:
        type: array
        items:
          type: object
          additionalProperties: false
          properties:
            command:
              type: string
            exit_code:
              type: integer
            stdout:
              type: string
            stderr:
              type: string
          required:
          - command
          - exit_code
    required:
    - status
    - results
  output_type: validation-command-report
  output_mime: application/json
  output_path: "$ARTIFACTS_DIR/validation-commands.json"
- id: validate
  command: change-validation
  depends_on:
  - implement
  - validation-commands
  trigger_rule: all_done
  when: $implement.output.status == "ready"
  model: review
  output_format:
    type: object
    additionalProperties: false
    properties:
      status:
        type: string
        enum:
        - ready
        - blocked
        - failed
      code:
        type: string
        enum:
        - VALIDATION_PASSED
        - VALIDATION_FAILED
        - VALIDATION_ENVIRONMENT_MISSING
        - ACCEPTANCE_NOT_PROVEN
        - DIFF_SCOPE_VIOLATION
      summary:
        type: string
      evidence:
        type: array
        items:
          type: string
        minItems: 1
        uniqueItems: true
      artifact_path:
        type: string
    required:
    - status
    - code
    - summary
    - evidence
    - artifact_path
  output_type: validation-report
  output_mime: text/markdown
  output_path: "$ARTIFACTS_DIR/validation-report.md"
- id: recover
  command: workflow-recovery
  depends_on:
  - validate
  - validation-commands
  trigger_rule: all_done
  when: $validation-commands.output.status != "ready" || $validate.output.status
    != "ready"
  output_format:
    type: object
    additionalProperties: false
    properties:
      status:
        type: string
        enum:
        - ready
        - blocked
        - failed
      code:
        type: string
        enum:
        - RECOVERY_APPLIED
        - RECOVERY_NOT_POSSIBLE
        - RECOVERY_REQUIRES_HUMAN
        - RECOVERY_SCOPE_CONFLICT
      summary:
        type: string
      evidence:
        type: array
        items:
          type: string
        minItems: 1
        uniqueItems: true
      artifact_path:
        type: string
    required:
    - status
    - code
    - summary
    - evidence
    - artifact_path
  output_type: recovery-report
  output_mime: text/markdown
  output_path: "$ARTIFACTS_DIR/recovery-report.md"
- id: revalidation-commands
  depends_on:
  - recover
  when: $validation-commands.output.status != "ready" || $validate.output.status
    != "ready"
  script:
    runtime: validation
  allow_failure: true
  output_format:
    type: object
    additionalProperties: false
    properties:
      status:
        type: string
        enum:
        - ready
        - failed
      results:
        type: array
        items:
          type: object
          additionalProperties: false
          properties:
            command:
              type: string
            exit_code:
              type: integer
            stdout:
              type: string
            stderr:
              type: string
          required:
          - command
          - exit_code
    required:
    - status
    - results
  output_type: validation-command-report
  output_mime: application/json
  output_path: "$ARTIFACTS_DIR/revalidation-commands.json"
- id: revalidate
  command: change-validation
  depends_on:
  - revalidation-commands
  model: review
  trigger_rule: all_done
  when: $validation-commands.output.status != "ready" || $validate.output.status
    != "ready"
  output_format:
    type: object
    additionalProperties: false
    properties:
      status:
        type: string
        enum:
        - ready
        - blocked
        - failed
      code:
        type: string
        enum:
        - VALIDATION_PASSED
        - VALIDATION_FAILED
        - VALIDATION_ENVIRONMENT_MISSING
        - ACCEPTANCE_NOT_PROVEN
        - DIFF_SCOPE_VIOLATION
      summary:
        type: string
      evidence:
        type: array
        items:
          type: string
        minItems: 1
        uniqueItems: true
      artifact_path:
        type: string
    required:
    - status
    - code
    - summary
    - evidence
    - artifact_path
  output_type: validation-report
  output_mime: text/markdown
  output_path: "$ARTIFACTS_DIR/validation-report.md"
- id: validation-gate
  depends_on:
  - validation-commands
  - validate
  - recover
  - revalidation-commands
  - revalidate
  trigger_rule: all_done
  bash: |
    if { [ $validation-commands.output.status = "ready" ] && [ $validate.output.status = "ready" ]; } || { [ $revalidation-commands.output.status? = "ready" ] && [ $revalidate.output.status? = "ready" ]; }; then
      exit 0
    fi
    printf 'validation failed: initial=%s recovery=%s revalidate=%s
    '   $validate.output.code '$recover.output.code?' '$revalidate.output.code?' >&2
    exit 1
- id: create-pr
  command: pr-finalize
  depends_on:
  - validation-gate
  output_format:
    type: object
    additionalProperties: false
    properties:
      status:
        type: string
        enum:
        - ready
        - blocked
        - failed
      code:
        type: string
        enum:
        - PR_READY
        - PR_GIT_STATE_INVALID
        - PR_DIFF_SCOPE_VIOLATION
        - PR_VALIDATION_MISSING
        - PR_PUSH_FAILED
        - PR_CREATE_FAILED
      summary:
        type: string
      evidence:
        type: array
        items:
          type: string
        minItems: 1
        uniqueItems: true
      artifact_path:
        type: string
    required:
    - status
    - code
    - summary
    - evidence
    - artifact_path
  output_type: pr-metadata
  output_mime: application/json
  output_path: "$ARTIFACTS_DIR/pr.json"
- id: review
  depends_on:
  - create-pr
  when: $create-pr.output.status == "ready"
  workflow:
    path: smart-review-block.yaml
    input: "$ARGUMENTS"
    isolation: inherit
- id: summary
  command: workflow-final-summary
  depends_on:
  - review
  model: review
  output_format:
    type: object
    additionalProperties: false
    properties:
      status:
        type: string
        enum:
        - ready
        - blocked
        - failed
      code:
        type: string
        enum:
        - WORKFLOW_COMPLETE
        - WORKFLOW_INCOMPLETE
        - EVIDENCE_INCONSISTENT
      summary:
        type: string
      evidence:
        type: array
        items:
          type: string
        minItems: 1
        uniqueItems: true
      artifact_path:
        type: string
    required:
    - status
    - code
    - summary
    - evidence
    - artifact_path
  output_type: workflow-summary
  output_mime: text/markdown
  output_path: "$ARTIFACTS_DIR/summary.md"
worktree:
  enabled: true
  cleanup: on_success
name: fix-github-issue
description: Resolve one GitHub issue through exact intake, Git preparation, root-cause
  evidence, reproduction, scoped plan, implementation, validation recovery, PR and
  review.
provider: coding-agent
model: implementation
