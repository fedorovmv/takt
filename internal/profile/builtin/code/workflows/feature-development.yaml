---
worktree:
  enabled: true
  cleanup: on_success
nodes:
- id: implement
  command: implement-change
  attempts:
    max: 3
    retry_on:
    - exit
    retry_session: reuse
  hooks:
    after_node:
    - id: validation
      bash: |
        ./.takt/profiles/code/tools/require-artifacts "$ARTIFACTS_DIR/implementation.md"
        ./.takt/profiles/code/tools/require-change
        exec ./.takt/profiles/code/tools/validate
      on_failure:
        action: retry
        session: resume
- id: validate-agent
  depends_on:
  - implement
  command: feature-validation
  model: review
- id: initial-verdict
  depends_on:
  - validate-agent
  trigger_rule: all_done
  bash: |
    if [ $validate-agent.status? != "completed" ]; then
      printf '%s\n' 'validation producer did not complete' >&2
      exit 1
    fi
    exec ./.takt/profiles/code/tools/require-verdict "$ARTIFACTS_DIR/validation.md" validation
- id: repair
  depends_on:
  - initial-verdict
  when: $initial-verdict.output == "REPAIR"
  command: feature-repair
  model: implementation
- id: revalidate-agent
  depends_on:
  - repair
  when: $repair.status == "completed"
  command: feature-revalidation
  model: review
- id: revalidation-verdict
  depends_on:
  - revalidate-agent
  trigger_rule: all_done
  when: $repair.status == "completed"
  bash: |
    if [ $revalidate-agent.status? != "completed" ]; then
      printf '%s\n' 'revalidation producer did not complete' >&2
      exit 1
    fi
    exec ./.takt/profiles/code/tools/require-verdict "$ARTIFACTS_DIR/revalidation.md" revalidation
- id: review-acceptance-gate
  depends_on:
  - initial-verdict
  - repair
  - revalidation-verdict
  trigger_rule: all_done
  bash: |
    ./.takt/profiles/code/tools/require-artifacts "$ARTIFACTS_DIR/validation.md"
    if [ $initial-verdict.output? = "PASS" ] || \
      { [ $initial-verdict.output? = "REPAIR" ] && [ $revalidation-verdict.output? = "PASS" ] && ./.takt/profiles/code/tools/require-artifacts "$ARTIFACTS_DIR/review-fixes.md" "$ARTIFACTS_DIR/revalidation.md"; }; then
      printf '%s' 'REVIEW_ACCEPTED'
      exit 0
    fi
    printf '%s\n' 'REVIEW_REJECTED' >&2
    exit 1
- id: validate
  depends_on:
  - review-acceptance-gate
  bash: "./.takt/profiles/code/tools/validate"
- id: create-pr
  depends_on:
  - validate
  command: create-pr
  allow_failure: true
- id: pr-effect-gate
  depends_on:
  - create-pr
  trigger_rule: all_done
  bash: |
    if [ $create-pr.status? != "completed" ]; then
      printf '%s\n' 'PR producer did not complete' >&2
      exit 1
    fi
    ./.takt/profiles/code/tools/require-artifacts "$ARTIFACTS_DIR/pr.md" "$ARTIFACTS_DIR/pr-url.txt"
    exec ./.takt/profiles/code/tools/require-pr
- id: summary
  depends_on:
  - pr-effect-gate
  command: summary
  model: review
  hooks:
    after_node:
    - id: summary-artifact
      bash: |
        ./.takt/profiles/code/tools/require-artifacts "$ARTIFACTS_DIR/summary.md"
name: feature-development
description: Implement a feature from an existing plan, validate it deterministically,
  and create a pull request.
provider: coding-agent
model: implementation
