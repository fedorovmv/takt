apiVersion: takt/v1alpha1
kind: Workflow
metadata:
  name: code-smart-review-block
  description: Classify review scope, dynamically fan out governed reviewers, synthesize and repair findings.
defaults:
  assistant: opencode
  model: review
  session: fresh
nodes:
  - id: scope
    command: review-scope

  - id: classify
    depends_on: [scope]
    command: classify-review
    model: routing
    allowed_tools: []
    skills: []
    output_format:
      type: object
      additionalProperties: false
      properties:
        reviewers:
          type: array
          items:
            type: string
            enum: [code, errors, tests, docs, simplicity]
        complexity:
          type: string
          enum: [trivial, small, medium, large]
        reason:
          type: string
      required: [reviewers, complexity, reason]

  - id: reviews
    depends_on: [scope, classify]
    workflow:
      path: review-perspective.yaml
      input: |
        Perspective: ${reviewer}

        Scoped change:
        ${nodes.scope.output}
      isolation: inherit
      output_node: review
      fan_out:
        items_from: nodes.classify.output.reviewers
        as: reviewer
        max_parallel: 5
        join: all_success

  - id: synthesize
    depends_on: [reviews]
    command: synthesize-review

  - id: fixes
    depends_on: [synthesize]
    command: fix-review-findings
    model: implementation
    attempts:
      max: 2
    hooks:
      after_node:
        - id: validate-fixes
          bash: ./.takt/profiles/code/tools/validate
          on_failure:
            action: retry
            session: resume

  - id: final-validation
    depends_on: [fixes]
    bash: ./.takt/profiles/code/tools/validate
