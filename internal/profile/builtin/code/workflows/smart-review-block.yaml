---
nodes:
- id: scope
  command: review-intake
  model: review
  output_format:
    type: object
    additionalProperties: false
    properties:
      status:
        type: string
        enum:
        - ready
        - blocked
        - failed
      code:
        type: string
        enum:
        - REVIEW_READY
        - PR_NOT_FOUND
        - PR_REPOSITORY_MISMATCH
        - PR_BASE_STALE
        - PR_CONFLICTED
        - REVIEW_SCOPE_EMPTY
      summary:
        type: string
      evidence:
        type: array
        items:
          type: string
        minItems: 1
        uniqueItems: true
      artifact_path:
        type: string
    required:
    - status
    - code
    - summary
    - evidence
    - artifact_path
  output_type: review-scope
  output_mime: application/json
  output_path: "$ARTIFACTS_DIR/review-scope.json"
- id: classify
  depends_on:
  - scope
  when: $scope.output.status == "ready"
  command: classify-review
  model: routing
  allowed_tools: []
  skills: []
  output_format:
    type: object
    additionalProperties: false
    properties:
      reviewers:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: string
          enum:
          - code
          - errors
          - tests
          - docs
          - simplicity
      complexity:
        type: string
        enum:
        - trivial
        - small
        - medium
        - large
      reason:
        type: string
    required:
    - reviewers
    - complexity
    - reason
  output_type: review-routing
  output_mime: application/json
- id: reviews
  depends_on:
  - scope
  - classify
  when: $scope.output.status == "ready"
  workflow:
    path: review-perspective.yaml
    input: |
      Perspective: $FANOUT.item

      Scoped change artifact: $ARTIFACTS_DIR/review-scope.json
    isolation: inherit
    output_node: review
    fan_out:
      items_from: $classify.output.reviewers
      as: perspective
      max_parallel: 5
      join: all_success
- id: synthesize
  when: $scope.output.status == "ready"
  command: review-synthesis
  depends_on:
  - reviews
  model: review
  output_format:
    type: object
    additionalProperties: false
    properties:
      status:
        type: string
        enum:
        - ready
        - blocked
        - failed
      code:
        type: string
        enum:
        - REVIEW_APPROVED
        - REVIEW_CHANGES_REQUIRED
        - REVIEW_EVIDENCE_INCOMPLETE
        - REVIEW_SCOPE_CHANGED
      summary:
        type: string
      evidence:
        type: array
        items:
          type: string
        minItems: 1
        uniqueItems: true
      artifact_path:
        type: string
    required:
    - status
    - code
    - summary
    - evidence
    - artifact_path
  output_type: review-report
  output_mime: text/markdown
  output_path: "$ARTIFACTS_DIR/review-report.md"
- id: fixes
  command: review-fix
  depends_on:
  - synthesize
  when: $scope.output.status == "ready" && $synthesize.output.code == "REVIEW_CHANGES_REQUIRED"
  output_format:
    type: object
    additionalProperties: false
    properties:
      status:
        type: string
        enum:
        - ready
        - blocked
        - failed
      code:
        type: string
        enum:
        - REVIEW_FIXES_APPLIED
        - REVIEW_NO_FIXES_REQUIRED
        - REVIEW_FIX_REQUIRES_DECISION
        - REVIEW_FIX_VALIDATION_FAILED
        - REVIEW_FIX_SCOPE_DRIFT
      summary:
        type: string
      evidence:
        type: array
        items:
          type: string
        minItems: 1
        uniqueItems: true
      artifact_path:
        type: string
    required:
    - status
    - code
    - summary
    - evidence
    - artifact_path
  output_type: review-fix-report
  output_mime: text/markdown
  output_path: "$ARTIFACTS_DIR/review-fix-report.md"
- id: validate
  when: $scope.output.status == "ready"
  command: change-validation
  depends_on:
  - synthesize
  - fixes
  model: review
  output_format:
    type: object
    additionalProperties: false
    properties:
      status:
        type: string
        enum:
        - ready
        - blocked
        - failed
      code:
        type: string
        enum:
        - VALIDATION_PASSED
        - VALIDATION_FAILED
        - VALIDATION_ENVIRONMENT_MISSING
        - ACCEPTANCE_NOT_PROVEN
        - DIFF_SCOPE_VIOLATION
      summary:
        type: string
      evidence:
        type: array
        items:
          type: string
        minItems: 1
        uniqueItems: true
      artifact_path:
        type: string
    required:
    - status
    - code
    - summary
    - evidence
    - artifact_path
  output_type: validation-report
  output_mime: text/markdown
  output_path: "$ARTIFACTS_DIR/validation-report.md"
  trigger_rule: all_done
name: code-smart-review-block
description: Evidence-scoped governed review, synthesis, controlled fixes and independent
  validation.
provider: coding-agent
model: review
