apiVersion: takt/v1alpha1
kind: Workflow
metadata:
  name: composition
nodes:
  - id: prepare
    subworkflow:
      path: parts/write.yaml
      inputs:
        value: first

  - id: repeat
    depends_on: [prepare]
    foreach:
      as: value
      items:
        - second
        - third
      subworkflow:
        path: parts/write.yaml
        inputs:
          value: ${value}
