apiVersion: takt/v1alpha1
kind: Workflow
metadata:
  name: opencode-inline-prompt
defaults:
  assistant: opencode
  model: deep
  session: resume
nodes:
  - id: implement
    prompt: |
      Выполни запрос:
      ${input}

      Сохрани результат в рабочей директории и кратко опиши изменения.
    timeout: 20m
