apiVersion: takt/evaluation/v1alpha1
kind: EvaluationMatrix
metadata:
  name: route-dsl-strategies

benchmark:
  id: route-dsl-production-shaped-25-v1
  baseline_strategy: baseline-direct
  cases: cases
  case_manifest: cases.yaml
  workspace_template: workspace
  repeat: 3
  quality_node: full-validation
  generation_node: implement
  validator:
    id: route-tool
    version: replace-me
    path: workspace/route-tool

strategies:
  - id: baseline-direct
    workflow: strategies/baseline-direct.yaml
    config: config.example.yaml

  - id: feedback-repair
    workflow: strategies/feedback-repair.yaml
    config: config.example.yaml

  - id: inspect-feedback
    workflow: strategies/inspect-feedback.yaml
    config: config.example.yaml

# Gates are intentionally opt-in: first collect a baseline on the target model,
# then pin thresholds appropriate for that environment.
