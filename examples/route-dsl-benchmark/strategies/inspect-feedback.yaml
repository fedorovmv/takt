---
nodes:
- id: inspect
  prompt: |
    Проанализируй техническое задание для Route DSL до изменения файлов.

    Техническое задание:
    $ARGUMENTS

    Кратко верни:
    - требуемые входы и выходы;
    - необходимые компоненты DSL;
    - ветвления и обработку ошибок;
    - ограничения и потенциально неподдерживаемые требования.

    На этом шаге route.yaml не изменяй.
- id: implement
  depends_on:
  - inspect
  prompt: |
    Создай или исправь route.yaml.

    Техническое задание:
    $ARGUMENTS

    Предварительный анализ:
    $inspect.output

    Диагностика предыдущей попытки:
    $FEEDBACK

    Требования:
    - работай только в текущей рабочей области;
    - итоговый route.yaml должен пройти ./route-tool validate route.yaml;
    - не придумывай отсутствующие возможности DSL.
  attempts:
    max: 3
  hooks:
    after_node:
    - id: validate-generated-route
      bash: "./route-tool validate route.yaml\n"
      on_failure:
        action: retry
        session: resume
  context:
- id: full-validation
  depends_on:
  - implement
  bash: "./route-tool validate route.yaml\n"
name: route-dsl-inspect-feedback
description: Предварительный анализ требований плюс bounded feedback repair
provider: coding-agent
model: route-model
