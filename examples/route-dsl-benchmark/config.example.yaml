apiVersion: takt/v1alpha1
kind: Config

default_assistant: pi

models:
  route-model:
    provider: aihub
    id: Qwen/Qwen3.6-27B
    params:
      reasoning_effort: high

assistants:
  pi:
    type: pi
    binary: pi
    session_dir: .takt/pi-sessions
    project_trust: approve
    max_output_bytes: 10485760

  # Для OpenCode достаточно переключить default_assistant: opencode и заполнить
  # параметры ниже под установленную версию CLI.
  # opencode:
  #   type: opencode
  #   binary: opencode
  #   auto_approve: true
  #   max_output_bytes: 10485760
