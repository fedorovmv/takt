---
nodes:
- id: implement
  prompt: |
    Inspect the workspace and implement the requested change:
    $ARGUMENTS

    Return JSON with summary and tests_passed.
  executor: external
  allowed_tools:
  - read
  - grep
  - edit
  - write
  - bash
  requires:
  - tool_policy
  - tool_control
  - agent_events_v2
  - tool_events
  tool_approval:
    mode: required
    tools:
    - edit
    - write
    - bash
    message: Allow ${tool} for this implementation?
  output_format:
    type: object
    properties:
      summary:
        type: string
      tests_passed:
        type: boolean
    required:
    - summary
    - tests_passed
  output_type: implementation-report
  output_mime: application/json
- id: report
  depends_on:
  - implement
  bash: printf '%s' $implement.output.summary
name: external-executor-example
description: Delegate one structured implementation step to an MCP-connected coding
  agent.
provider: delegated
model: coding
