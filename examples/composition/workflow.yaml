---
nodes:
- id: prepare
  subworkflow:
    path: workflows/write-item.yaml
    inputs:
      name: first
- id: batch
  depends_on:
  - prepare
  foreach:
    as: service
    items_from:
      path: items.yaml
    subworkflow:
      path: workflows/write-item.yaml
      inputs:
        name: $INPUTS.service
- id: verify
  depends_on:
  - batch
  bash: 'test "$(tr ''\n'' '','' < order.txt)" = "first,second,third,"

'
name: composition-example
