---
nodes:
- id: implement
  timeout: 15m
  skills: []
  prompt: |
    Выполни Go-задачу в текущей рабочей области.

    Задача:
    $ARGUMENTS

    Исправляй только разрешённый production package. Не изменяй go.mod,
    *_test.go, соседние packages и benchmark metadata. Проверь результат
    указанной в задаче командой go test.

    $FEEDBACK
- id: full-validation
  depends_on:
  - implement
  timeout: 10m
  bash: |
    mkdir -p .takt
    cat > .takt/evaluation-case.md <<'TAKT_GO_CASE'
    $ARGUMENTS
    TAKT_GO_CASE
    "$TAKT_GO_BENCHMARK_VALIDATOR" \
      --case-file .takt/evaluation-case.md \
      --baseline "$TAKT_GO_BENCHMARK_BASELINE" \
      --workspace .
name: go-benchmark-baseline-direct
description: Один coding-agent вызов и независимая Go-проверка
provider: coding-agent
model: go-model
