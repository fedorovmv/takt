---
nodes:
- id: inventory
  script:
    runtime: command
    path: scripts/inventory.sh
  output_format:
    type: object
    properties:
      files:
        type: array
        items:
          type: string
    required:
    - files
- id: review
  depends_on:
  - inventory
  command: package-review
  skills:
  - skills/review
  mcp: mcp.json
  output_format:
    type: object
    properties:
      summary:
        type: string
    required:
    - summary
name: portable-review
provider: coding-agent
model: review
