apiVersion: takt/v1alpha1
kind: Config
models:
  implementation: {provider: replace, id: replace-with-model}
  review: {provider: replace, id: replace-with-model}
  routing: {provider: replace, id: replace-with-model}
assistants:
  opencode:
    type: opencode
    binary: opencode
    args: [--pure]
    agent: build
    auto_approve: true
    max_output_bytes: 10485760
    env:
      FAKE_FLOW_EVAL_SMOKE: "1"
