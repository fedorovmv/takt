apiVersion: takt/v1alpha1
kind: Config

models:
  large:
    provider: demo
    id: qwen-large
    params:
      reasoning_effort: high
  fast:
    provider: demo
    id: qwen-fast

assistants:
  demo:
    type: mock
  pi:
    type: pi
    binary: pi
    project_trust: deny
    capabilities: [session_resume]
  opencode:
    type: process
    argv: ["opencode", "run", "{{prompt}}"]
    capabilities: [session_resume, mcp, skills]
