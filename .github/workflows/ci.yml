name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: make check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned TypeScript compiler
        run: npm install --global typescript@5.7.2
      - name: Configure Git identity
        run: |
          git config --global user.name "Takt CI"
          git config --global user.email "takt-ci@example.invalid"
      - name: Run release gate
        env:
          TAKT_REQUIRE_TYPESCRIPT: "1"
        run: make check
